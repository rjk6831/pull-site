<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1B1A33" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFF7EA" media="(prefers-color-scheme: light)">

<style>
:root{--bg:#1B1A33;--bg2:#2A2752;--panel:#2A2752;--text:#FFF4E0;--muted:#CFC6E8;--teal:#2FC3C8;--tealbtn:#1DA4A8;--gold:#F5C451;--coral:#FF7A66;--coral-h:#FF9080;--ink:#1B1A33;--line:rgba(255,244,224,.18);--bead1:#F28C28;--bead2:#FFF4E0;--bead3:#1DA4A8;--bead4:#F5C451;--glow:rgba(47,195,200,.22)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#FFF7EA;--bg2:#FFEBD0;--panel:#FFFFFF;--text:#1B1A33;--muted:#4A4670;--teal:#0B6E72;--tealbtn:#0B6E72;--gold:#8A5A00;--coral-h:#FF8F7D;--line:rgba(27,26,51,.2);--bead2:#2A2752;--glow:rgba(29,164,168,.18)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(900px 520px at 80% -10%,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2));background-color:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;justify-content:center}
.hero{display:grid;gap:28px;justify-items:center;text-align:center}
.stage{position:relative;width:196px;height:196px;display:grid;place-items:center;margin-top:8px}
.stage img{position:relative;z-index:1;width:132px;height:132px;border-radius:30px;box-shadow:0 14px 34px rgba(0,0,0,.35),0 0 0 1px var(--line)}
.bead{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:var(--c);opacity:0;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.35);animation:pull 4.8s cubic-bezier(.5,0,.2,1) infinite;animation-delay:var(--d)}
@keyframes pull{0%{transform:translate(var(--x),var(--y)) scale(.7);opacity:0}15%{opacity:.95}70%{transform:translate(calc(var(--x)*.38),calc(var(--y)*.38)) scale(1);opacity:.95}100%{transform:translate(0,0) scale(.4);opacity:0}}
h1{margin:0;font-size:clamp(32px,8.5vw,52px);line-height:1.08;letter-spacing:-.02em;font-weight:800}
h1 small{display:block;font-size:.55em;font-weight:700;color:var(--gold);letter-spacing:-.01em;margin-top:6px}
.pitch{margin:10px 0 0;font-size:clamp(18px,4.8vw,22px);color:var(--muted)}
.actions{display:grid;gap:12px;width:100%;max-width:360px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;padding:10px 22px;border-radius:999px;font-weight:800;font-size:18px;line-height:1.2;text-decoration:none;border:2px solid transparent;transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.btn small{font-size:13px;font-weight:600;opacity:.9}
.btn.primary{background:var(--coral);color:var(--ink);box-shadow:0 8px 22px rgba(255,122,102,.32)}
.btn.primary:hover{background:var(--coral-h);transform:translateY(-2px)}
.btn.primary:active{transform:translateY(0) scale(.98)}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}
.btn.secondary[href]{border-color:var(--teal);color:var(--text)}
.btn.secondary[href]:hover{background:var(--glow)}
.btn[aria-disabled=true]{cursor:default;opacity:1;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.status{min-height:24px;margin:0;color:var(--muted);font-size:15px}
.bar{display:none;width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 auto}
.redirecting .bar{display:block}.bar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left;animation:fill .6s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qr{display:none;text-align:center}
.qr figure{margin:0;display:inline-block;background:#fff;padding:12px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.qr svg{display:block;width:168px;height:168px}
.qr figcaption{margin-top:10px;color:var(--muted);font-size:14px}
.qr figcaption{margin-top:0;padding-top:12px;color:#4A4670}
footer{padding:16px 16px max(20px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--teal);margin:0 8px}
noscript .ns{max-width:360px;margin:16px auto 0;display:grid;gap:10px}
@media (min-width:760px){
 .hero{grid-template-columns:1fr auto;grid-template-areas:"stage qr" "copy qr";gap:24px 72px;text-align:left;justify-items:start;align-items:center}
 .hero .stage{grid-area:stage}.hero .copy{grid-area:copy}
 .qr{display:block;grid-area:qr;justify-self:center}
 .hero{grid-template-columns:auto 220px;grid-template-areas:"stage qr" "copy qr";justify-content:center;column-gap:104px}
 .stage{margin:0 0 0 -32px}
 .actions{max-width:none;grid-template-columns:1fr 1fr;width:auto}
 .actions .btn{min-width:200px}
 .status,.bar{margin-left:0}
}
@media (hover:none) and (pointer:coarse){.qr{display:none!important}}
@media (prefers-reduced-motion:reduce){.bead{animation:none;opacity:0}.btn{transition:none}.bar i{animation:none;transform:none}}
</style></head>
<body>
<main>
<section class="hero" id="hero" aria-labelledby="title">
 <div class="stage" aria-hidden="true" id="stage"><img src="../icon.png" width="132" height="132" alt=""></div>
 <div class="copy">
  <h1 id="title">PULL<small>Magnet Sort</small></h1>
  <p class="pitch" data-i18n="pitch">Sort the magnets. Reveal the picture.</p>
  <div class="actions" style="margin-top:24px">
   <a class="btn primary" id="ios" href="https://testflight.apple.com/join/2nsPVVzH"><span data-i18n="ios">Get it on iPhone</span></a>
   <a class="btn secondary" id="android" aria-disabled="true"><span data-i18n="android">Get it on Android</span><small data-i18n="soon">Coming soon to Google Play</small></a>
  </div>
  <p class="status" id="status" role="status" aria-live="polite" style="margin-top:16px"></p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <noscript><div class="ns">
   <a class="btn primary" href="https://testflight.apple.com/join/2nsPVVzH">Get it on iPhone</a>
   <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.rootsnolimits.pull">Get it on Android</a>
  </div></noscript>
 </div>
 <aside class="qr" aria-label="Scan to open on your phone"><figure>@@QR@@<figcaption data-i18n="scan">Scan with your phone</figcaption></figure></aside>
</section>
</main>
<footer><a href="../privacy.html">Privacy</a><a href="../terms.html">Terms</a><a href="../support.html">Support</a><div style="margin-top:6px">Roots No Limits LLC</div></footer>
<script>
// ---- Config ----
var IOS_URL="https://testflight.apple.com/join/2nsPVVzH";
var ANDROID_URL="https://play.google.com/store/apps/details?id=com.rootsnolimits.pull";
var ANDROID_LIVE=false;
var REDIRECT_DELAY_MS=600;
// ---- Copy ----
var STRINGS={
 en:{pitch:"Sort the magnets. Reveal the picture.",ios:"Get it on iPhone",android:"Get it on Android",soon:"Coming soon to Google Play",scan:"Scan with your phone",opening:"Opening PULL…",alt:"Android version coming soon. Get it on iPhone now."},
 th:{pitch:"จัดเรียงแม่เหล็ก เผยภาพลับ",ios:"ดาวน์โหลดบน iPhone",android:"ดาวน์โหลดบน Android",soon:"เร็วๆ นี้บน Google Play",scan:"สแกนด้วยมือถือของคุณ",opening:"กำลังเปิด PULL…",alt:"เวอร์ชัน Android เร็วๆ นี้ ดาวน์โหลดบน iPhone ได้แล้ว"}
};
(function(){
 var lang=((navigator.language||"en")+"").toLowerCase().indexOf("th")===0?"th":"en";
 var S=STRINGS[lang];
 document.documentElement.lang=lang;
 var els=document.querySelectorAll("[data-i18n]");
 for(var i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(S[k])els[i].textContent=S[k];}

 // ---- src passthrough ----
 var m=/[?&]src=([^&#]*)/.exec(location.search),src="";
 if(m){try{src=decodeURIComponent(m[1])}catch(e){}src=src.replace(/[^A-Za-z0-9_\-]/g,"").slice(0,40);}
 function withSrc(url,kind){
  if(!src)return url;
  if(kind==="play")return url+(url.indexOf("?")<0?"?":"&")+"referrer=utm_source%3Dshare%26utm_content%3D"+src;
  // Hook for when IOS_URL becomes an App Store URL. Never added to TestFlight links.
  if(kind==="ios"&&/^https:\/\/apps\.apple\.com\//.test(url))return url+(url.indexOf("?")<0?"?":"&")+"ct="+src;
  return url;
 }
 var iosHref=withSrc(IOS_URL,"ios"),playHref=withSrc(ANDROID_URL,"play");
 var ios=document.getElementById("ios"),and=document.getElementById("android"),status=document.getElementById("status");
 ios.href=iosHref;
 if(ANDROID_LIVE){and.href=playHref;and.removeAttribute("aria-disabled");var sm=and.querySelector("small");if(sm)sm.style.display="none";}

 // ---- Device ----
 var ua=navigator.userAgent||"";
 var isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 var isAndroid=/Android/i.test(ua);
 var target=isIOS?iosHref:(isAndroid&&ANDROID_LIVE?playHref:"");
 var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

 // ---- Bead motion ----
 if(!reduce){
  var st=document.getElementById("stage"),cols=["--bead1","--bead2","--bead3","--bead4"],html="";
  for(var j=0;j<14;j++){
   var a=(j/14)*Math.PI*2+(j%3)*0.2,r=88+(j%4)*6;
   html+='<span class="bead" style="--x:'+Math.round(Math.cos(a)*r)+'px;--y:'+Math.round(Math.sin(a)*r)+'px;--c:var('+cols[j%4]+');--d:-'+((j*0.34).toFixed(2))+'s"></span>';
  }
  st.insertAdjacentHTML("afterbegin",html);
 }

 // ---- Route ----
 if(target){
  status.textContent=S.opening;
  document.getElementById("hero").classList.add("redirecting");
  setTimeout(function(){location.replace(target)},reduce?0:REDIRECT_DELAY_MS);
 }else if(isAndroid){status.textContent=S.alt;}
})();
</script>
</body></html>
